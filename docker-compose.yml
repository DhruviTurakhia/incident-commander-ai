services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/incident_commander.db
    volumes:
      - incident-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.27
    profiles: ["temporal"]
    ports:
      - "7233:7233"
    environment:
      DB: sqlite

  temporal-ui:
    image: temporalio/ui:2.34.0
    profiles: ["temporal"]
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

volumes:
  incident-data:

